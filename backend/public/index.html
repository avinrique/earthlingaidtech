<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="same-origin" />
<title>Leads · Earthling Aidtech</title>
<link rel="stylesheet" href="/admin.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-160 -160 320 320'%3E%3Cg stroke='%230D0D0D' stroke-width='10' stroke-linejoin='round'%3E%3Cpolygon points='0,-148 128,-74 0,0 -128,-74' fill='%232E2E2E'/%3E%3Cpolygon points='128,-74 128,74 0,148 0,0' fill='%231C1C1C'/%3E%3Cpolygon points='-128,-74 0,0 0,148 -128,74' fill='%23111111'/%3E%3Cpolygon points='0,-56 48,-28 0,0 -48,-28' fill='%237FBEFF'/%3E%3Cpolygon points='48,-28 48,28 0,56 0,0' fill='%234A9EFF'/%3E%3Cpolygon points='-48,-28 0,0 0,56 -48,28' fill='%232E7BD6'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body>

<!-- Sprite sheet: same-document <use> targets, so no network request is ever made. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="i-cube" viewBox="-160 -160 320 320">
    <g fill="none" stroke="#0D0D0D" stroke-width="6" stroke-linejoin="round">
      <polygon points="0,-148 128,-74 0,0 -128,-74" fill="#2E2E2E" />
      <polygon points="128,-74 128,74 0,148 0,0" fill="#1C1C1C" />
      <polygon points="-128,-74 0,0 0,148 -128,74" fill="#111111" />
      <polygon points="0,-92 80,-46 0,0 -80,-46" fill="#5E6B7A" />
      <polygon points="80,-46 80,46 0,92 0,0" fill="#3C4654" />
      <polygon points="-80,-46 0,0 0,92 -80,46" fill="#2A3340" />
      <polygon points="0,-40 35,-20 0,0 -35,-20" fill="#7FBEFF" />
      <polygon points="35,-20 35,20 0,40 0,0" fill="#4A9EFF" />
      <polygon points="-35,-20 0,0 0,40 -35,20" fill="#2E7BD6" />
    </g>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
  </symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" />
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M4 21h16" />
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6" />
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
  </symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="16" rx="2" /><path d="m2 7 10 6 10-6" />
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18" /><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" /><path d="M19 6v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6" />
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
  </symbol>
</svg>

<div class="grid-bg" aria-hidden="true"></div>

<!-- ══ BOOT ══ -->
<div id="view-boot" class="boot">
  <svg class="boot__mark" width="44" height="44" aria-hidden="true"><use href="#i-cube" /></svg>
  <p class="boot__text">Checking session…</p>
</div>

<!-- ══ LOGIN ══ -->
<main id="view-login" class="login" hidden>
  <div class="login__glow" aria-hidden="true"></div>
  <form id="login-form" class="login__card" novalidate>
    <div class="login__brand">
      <svg width="48" height="48" aria-hidden="true"><use href="#i-cube" /></svg>
      <div>
        <p class="login__word">Earthling <span>Aidtech</span></p>
        <p class="login__sub">Lead console</p>
      </div>
    </div>

    <label class="field">
      <span class="field__label">Password</span>
      <span class="field__wrap">
        <svg class="field__icon" width="17" height="17" aria-hidden="true"><use href="#i-lock" /></svg>
        <input id="login-password" class="field__input" type="password" name="password"
               autocomplete="current-password" required aria-describedby="login-error" />
      </span>
    </label>

    <p id="login-error" class="login__error" role="alert" hidden></p>

    <button id="login-submit" class="btn btn--accent btn--block" type="submit">
      <span class="btn__label">Sign in</span>
    </button>

    <p class="login__foot">Authorised access only · earthlingaidtech.com</p>
  </form>
</main>

<!-- ══ DASHBOARD ══ -->
<div id="view-dash" hidden>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__brand">
        <svg width="30" height="30" aria-hidden="true"><use href="#i-cube" /></svg>
        <div class="topbar__titles">
          <h1 class="topbar__title">Leads</h1>
          <p id="topbar-total" class="topbar__count">—</p>
        </div>
      </div>
      <div class="topbar__actions">
        <button id="btn-refresh" class="btn btn--ghost btn--icon" type="button" title="Refresh" aria-label="Refresh leads">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-refresh" /></svg>
        </button>
        <a id="btn-export" class="btn btn--ghost" href="/api/export.csv" download>
          <svg width="16" height="16" aria-hidden="true"><use href="#i-download" /></svg>
          <span class="btn__label">Export CSV</span>
        </a>
        <button id="btn-logout" class="btn btn--ghost" type="button">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-logout" /></svg>
          <span class="btn__label">Log out</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <div id="tabs" class="tabs" role="group" aria-label="Filter leads by status"></div>
      <div class="search">
        <svg class="search__icon" width="16" height="16" aria-hidden="true"><use href="#i-search" /></svg>
        <input id="search" class="search__input" type="search" placeholder="Search name, email, company…"
               aria-label="Search leads" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <section id="list-region" aria-label="Leads" aria-busy="false">
      <div id="skeleton" class="skeleton" hidden aria-hidden="true"></div>
      <div id="list" class="list"></div>
      <div id="empty" class="empty" hidden>
        <svg width="34" height="34" aria-hidden="true"><use href="#i-search" /></svg>
        <p id="empty-title" class="empty__title">No leads yet</p>
        <p id="empty-note" class="empty__note">New enquiries from the site will land here.</p>
      </div>
      <div id="fatal" class="fatal" hidden>
        <p id="fatal-text" class="fatal__text">Couldn’t load leads.</p>
        <button id="fatal-retry" class="btn btn--ghost" type="button"><span class="btn__label">Try again</span></button>
      </div>
    </section>

    <nav id="pager" class="pager" aria-label="Pagination" hidden>
      <button id="pg-prev" class="btn btn--ghost btn--sm" type="button"><span class="btn__label">← Newer</span></button>
      <p id="pg-range" class="pager__range"></p>
      <button id="pg-next" class="btn btn--ghost btn--sm" type="button"><span class="btn__label">Older →</span></button>
    </nav>
  </main>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/admin.js"></script>
</body>
</html>
